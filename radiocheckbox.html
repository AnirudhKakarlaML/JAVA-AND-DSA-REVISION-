<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio</title>
</head>
<body>
    <form action="/server">
        <p>Pick One</p>
        <input type="radio" id="subject1" name="subject" value="DSA">
        <label for="subject1">DSA</label>
        <br>
        <input type="radio" id="subject2" name="subject" value="DAA">
        <label for="subject2">DAA</label>
        <br>
        <input type="radio" id="subject3" name="subject" value="FLA">
        <label for="subject3">FLA</label>
        <br>
        <button type="submit">Submit</button>

    </form>
    
</body>
</html>
