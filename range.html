<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range</title>
</head>
<body>
    <form action="/action">
        <label for="rate">Enter Rating</label>
        <input type="range" min="10" max="1000" step="1" id="rate" name="rating">
        <button type="submit">SUbmit</button>

    </form>
</body>
</html>
